name: IG 發文
on:
  schedule:
    # GitHub 排程實測延遲 4–5 小時，所以提早觸發、由 publish.py 等到發文時間
    - cron: "17 5,8 * * 2"   # 週二，等到 20:00 台灣（UTC+8）發
    - cron: "17 6,9 * * 6"   # 週六，等到 21:00 台灣發
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1＝只建草稿不發佈"
        default: "1"
permissions:
  contents: write
  issues: write
concurrency: ig-publish
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: python3 publish.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
          GH_TOKEN: ${{ github.token }}
          SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - if: github.event_name == 'schedule' || inputs.dry_run != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A queue && git diff --cached --quiet || (git commit -m "已發佈" && git push)
